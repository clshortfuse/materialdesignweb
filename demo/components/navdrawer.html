<!DOCTYPE html>
<html lang="en">

<head>
  <title>Navigation Drawer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="stylesheet" href="../theme.css" />

  <script src="../demo.min.js"></script>
</head>

<body>
  <demo-page>
    <mdw-box gap=16 padding=pane>
      <mdw-grid gap=16 role=region y=stretch>

        <demo-preview-card label="Standard" col-span=12 code="
&lt;mdw-nav-drawer headline=&quot;Mail&quot;&gt;
  &lt;mdw-nav-drawer-section&gt;
    &lt;mdw-nav-drawer-item icon=&quot;inbox&quot; href=&quot;#navdrawer&quot; active badge=&quot;24&quot;&gt;Inbox&lt;/mdw-nav-drawer-item&gt;
    &lt;mdw-nav-drawer-item icon=&quot;send&quot; href=&quot;#navdrawer&quot;&gt;Outbox&lt;/mdw-nav-drawer-item&gt;
    &lt;mdw-nav-drawer-item icon=&quot;folder&quot; expanded&gt;
      Folders
      &lt;div slot=&quot;expansion&quot;&gt;
        &lt;mdw-nav-drawer-item href=&quot;#navdrawer&quot;&gt;Primary&lt;/mdw-nav-drawer-item&gt;
        &lt;mdw-nav-drawer-item href=&quot;#navdrawer&quot;&gt;Social&lt;/mdw-nav-drawer-item&gt;
        &lt;mdw-nav-drawer-item href=&quot;#navdrawer&quot;&gt;Promotions&lt;/mdw-nav-drawer-item&gt;
      &lt;/div&gt;
    &lt;/mdw-nav-drawer-item&gt;
    &lt;mdw-nav-drawer-item icon=&quot;favorite&quot; href=&quot;#navdrawer&quot;&gt;Favorites&lt;/mdw-nav-drawer-item&gt;
    &lt;mdw-nav-drawer-item icon=&quot;delete&quot; href=&quot;#navdrawer&quot;&gt;Trash&lt;/mdw-nav-drawer-item&gt;
  &lt;/mdw-nav-drawer-section&gt;
  &lt;mdw-nav-drawer-section divider label=&quot;Labels&quot;&gt;
    &lt;mdw-nav-drawer-item icon=&quot;folder&quot; href=&quot;#navdrawer&quot;&gt;Label&lt;/mdw-nav-drawer-item&gt;
    &lt;mdw-nav-drawer-item icon=&quot;folder&quot; href=&quot;#navdrawer&quot;&gt;Label&lt;/mdw-nav-drawer-item&gt;
    &lt;mdw-nav-drawer-item icon=&quot;folder&quot; href=&quot;#navdrawer&quot;&gt;Label&lt;/mdw-nav-drawer-item&gt;
  &lt;/mdw-nav-drawer-section&gt;
&lt;/mdw-nav-drawer&gt;
">

          <mdw-nav-drawer headline="Mail" auto-open=0 fixed-breakpoint=0 style="min-height:560px;max-height:560px">
            <mdw-nav-drawer-section>
              <mdw-nav-drawer-item icon="inbox" href="#navdrawer" active badge="24">Inbox</mdw-nav-drawer-item>
              <mdw-nav-drawer-item icon="send" href="#navdrawer">Outbox</mdw-nav-drawer-item>
              <mdw-nav-drawer-item icon="folder" expanded>
                Folders
                <div slot="expansion">
                  <mdw-nav-drawer-item href="#navdrawer">Primary</mdw-nav-drawer-item>
                  <mdw-nav-drawer-item href="#navdrawer">Social</mdw-nav-drawer-item>
                  <mdw-nav-drawer-item href="#navdrawer">Promotions</mdw-nav-drawer-item>
                </div>
              </mdw-nav-drawer-item>
              <mdw-nav-drawer-item icon="favorite" href="#navdrawer">Favorites</mdw-nav-drawer-item>
              <mdw-nav-drawer-item icon="delete" href="#navdrawer">Trash</mdw-nav-drawer-item>
            </mdw-nav-drawer-section>
            <mdw-nav-drawer-section divider label="Labels">
              <mdw-nav-drawer-item icon="folder" href="#navdrawer">Label</mdw-nav-drawer-item>
              <mdw-nav-drawer-item icon="folder" href="#navdrawer">Label</mdw-nav-drawer-item>
              <mdw-nav-drawer-item icon="folder" href="#navdrawer">Label</mdw-nav-drawer-item>
            </mdw-nav-drawer-section>
          </mdw-nav-drawer>

        </demo-preview-card>

        <demo-preview-card label="Toned" col-span=12 code="
&lt;mdw-nav-drawer color=&quot;tertiary-container&quot;&gt;
  &lt;mdw-nav-drawer-item icon=&quot;edit&quot; href=&quot;#navdrawer&quot; badge=&quot;10&quot;&gt;Default&lt;/mdw-nav-drawer-item&gt;
  &lt;mdw-nav-drawer-item icon=&quot;change_history&quot; href=&quot;#navdrawer&quot; color=&quot;primary-container&quot;&gt;Primary&lt;/mdw-nav-drawer-item&gt;
  &lt;mdw-nav-drawer-item icon=&quot;change_history&quot; href=&quot;#navdrawer&quot; badge=&quot;999+&quot; color=&quot;green-container&quot;&gt;Green Container&lt;/mdw-nav-drawer-item&gt;
&lt;/mdw-nav-drawer&gt;
">

          <mdw-nav-drawer auto-open=0 fixed-breakpoint=0 color="tertiary-container"
            style="min-height:400px;max-height:400px;">
            <mdw-nav-drawer-item icon="edit" href="#navdrawer" badge="10">Default</mdw-nav-drawer-item>
            <mdw-nav-drawer-item icon="change_history" href="#navdrawer"
              color=primary-container>Primary</mdw-nav-drawer-item>
            <mdw-nav-drawer-item icon="change_history" href="#navdrawer" badge="999+" color=green-container>Green
              Container</mdw-nav-drawer-item>
          </mdw-nav-drawer>

        </demo-preview-card>

        <demo-preview-card label="Minimal" col-span=12 code="
&lt;mdw-nav-drawer&gt;
  &lt;mdw-nav-drawer-item icon=&quot;edit&quot; href=&quot;#navdrawer&quot;&gt;Default&lt;/mdw-nav-drawer-item&gt;
  &lt;mdw-nav-drawer-item icon=&quot;change_history&quot; href=&quot;#navdrawer&quot; color=&quot;primary-container&quot;&gt;Primary&lt;/mdw-nav-drawer-item&gt;
  &lt;mdw-nav-drawer-item icon=&quot;change_history&quot; href=&quot;#navdrawer&quot; color=&quot;tertiary-container&quot;&gt;Tertiary&lt;/mdw-nav-drawer-item&gt;
&lt;/mdw-nav-drawer&gt;
">

          <mdw-nav-drawer auto-open=0 fixed-breakpoint=0 style="min-height:400px;max-height:400px;">
            <mdw-nav-drawer-item icon="edit" href="#navdrawer">Default</mdw-nav-drawer-item>
            <mdw-nav-drawer-item icon="change_history" href="#navdrawer"
              color=primary-container>Primary</mdw-nav-drawer-item>
            <mdw-nav-drawer-item icon="change_history" href="#navdrawer"
              color=tertiary-container>Tertiary</mdw-nav-drawer-item>
          </mdw-nav-drawer>
        </demo-preview-card>
      </mdw-grid>
    </mdw-box>
  </demo-page>
</body>

</html>
